<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1b2e">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pustakam">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/PustakamLogo.svg') }}">
    <title>{% block title %}{{ app_name }} ({{ app_name_dev }}){% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/PustakamLogo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/PustakamStyle.css') }}?v={{ version }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
